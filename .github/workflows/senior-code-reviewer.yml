name: Senior code reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# If new commits arrive while reviewing, cancel the previous review
concurrency:
  group: senior-code-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history is needed to diff against the base branch

      # Dependencies so the reviewer can run typecheck, lint and tests.
      # The app (and its lock file) lives in frontend/, not at the repo root.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          # With a subscription (claude setup-token):
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Invoke the /senior-code-reviewer skill with this exact argument and nothing else:
            origin/${{ github.base_ref }}...HEAD

            Do not pass it the PR description, the title or any summary of the changes.

            When the skill returns its report, write it unchanged to review.md in the repository root
            (a throwaway file, never committed) and post it as a comment on the PR:
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          # Writing to /tmp was denied in CI even with Write(//tmp/**), so the report goes into the
          # workspace, which acceptEdits allows. The token cannot push (contents: read).
          # "cd *" lets the reviewer run "cd frontend && npm run ..." (the app lives in frontend/); the
          # read-only utilities avoid denials while it explores.
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools "Skill(senior-code-reviewer),Bash(cd *),Bash(git *),Bash(npm run *),Bash(npm test *),Bash(npx *),Bash(node *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(grep *),Bash(wc *),Bash(which *),Bash(mkdir -p /tmp/*),Bash(gh pr comment *),Write(review.md)"

      # The action hides the agent's output; list the denied tool calls so missing permissions are visible.
      - name: Show denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          jq -c '[.. | objects | select(.type? == "result")] | last | .permission_denials // [] | .[] | {tool: .tool_name, input: .tool_input}' \
            "${{ steps.claude.outputs.execution_file }}" || true
