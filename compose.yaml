services:
  app:
    build:
      context: frontend
      target: development
    env_file:
      - ./frontend/.env
    environment:
      - NUXT_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pets}?sslmode=disable
    ports:
      - 8000:8000
    volumes:
      - ./frontend:/app
      # todo node_modules should be created with current user and group id, not root
    depends_on:
      - db

  db:
    # Plain Postgres + pgvector, ready for the image search feature.
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pets}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  db-data:
